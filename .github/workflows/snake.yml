name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: faisalorakzai-lab
          outputs: |
            dist/github-snake.svg?color_snake=#D4AF37&color_dot_empty=#0d1117&color_dot_1=#1a1500&color_dot_2=#3d3000&color_dot_3=#7a5f00&color_dot_4=#b8961a&color_dot_5=#D4AF37
            dist/github-snake-dark.svg?color_snake=#D4AF37&color_dot_empty=#000000&color_dot_1=#111111&color_dot_2=#2a2200&color_dot_3=#5a4800&color_dot_4=#a0800e&color_dot_5=#D4AF37

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
