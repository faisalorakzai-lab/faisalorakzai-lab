<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <style>
      .snake-text { animation: snakePulse 2s ease-in-out infinite; }
      @keyframes snakePulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
      .dot { animation: dotPulse 1.5s ease-in-out infinite; }
      @keyframes dotPulse { 0%,100%{r:3;opacity:0.3} 50%{r:5;opacity:1} }
    </style>
  </defs>
  <rect width="900" height="120" fill="#000000"/>
  <rect width="900" height="120" fill="none" stroke="#D4AF37" stroke-width="0.4" opacity="0.2"/>
  <!-- Dots representing contributions -->
  <g class="snake-text">
    <text x="450" y="65" text-anchor="middle"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="4" fill="#D4AF37" opacity="0.6">CONTRIBUTION SNAKE · GENERATING · GITHUB ACTION RUNNING</text>
  </g>
  <!-- Animated snake dots placeholder -->
  <circle class="dot" cx="180" cy="60" r="3" fill="#D4AF37"/>
  <circle class="dot" cx="210" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.1s"/>
  <circle class="dot" cx="240" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.2s"/>
  <circle class="dot" cx="270" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.3s"/>
  <circle class="dot" cx="300" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.4s"/>
  <circle class="dot" cx="600" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.5s"/>
  <circle class="dot" cx="630" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.6s"/>
  <circle class="dot" cx="660" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.7s"/>
  <circle class="dot" cx="690" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.8s"/>
  <circle class="dot" cx="720" cy="60" r="3" fill="#D4AF37" style="animation-delay:0.9s"/>
</svg>
