<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0800"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F5D060" stop-opacity="1"/>
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8841F"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="warm">
        <feFuncR type="linear" slope="1.3"/>
        <feFuncG type="linear" slope="1.0"/>
        <feFuncB type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="warm"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sharpGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip paths -->
    <clipPath id="mainClip">
      <rect width="900" height="380" rx="0"/>
    </clipPath>

    <style>
      /* Animations */
      .pulse-a { animation: pulse 3s ease-in-out infinite; }
      .pulse-b { animation: pulse 3s ease-in-out 1s infinite; }
      .pulse-c { animation: pulse 3s ease-in-out 2s infinite; }
      @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

      .orbit-a { animation: orbit 12s linear infinite; transform-origin: 450px 190px; }
      .orbit-b { animation: orbit 18s linear infinite reverse; transform-origin: 450px 190px; }
      @keyframes orbit { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

      .fade-in-1 { animation: fi 1.5s ease-out 0.2s forwards; opacity:0; }
      .fade-in-2 { animation: fi 1.5s ease-out 0.8s forwards; opacity:0; }
      .fade-in-3 { animation: fi 1.5s ease-out 1.4s forwards; opacity:0; }
      .fade-in-4 { animation: fi 1.5s ease-out 2.0s forwards; opacity:0; }
      .fade-in-5 { animation: fi 1.5s ease-out 2.6s forwards; opacity:0; }
      @keyframes fi { from{opacity:0} to{opacity:1} }

      .scan { animation: scanLine 5s linear infinite; }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity:0; }
        5% { opacity: 0.5; }
        95% { opacity: 0.5; }
        100% { transform: translateY(385px); opacity: 0; }
      }

      .blink { animation: blink 1.4s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .grid-pulse { animation: gp 6s ease-in-out infinite; }
      @keyframes gp { 0%,100%{opacity:0.04} 50%{opacity:0.09} }

      .line-draw-h { animation: ldh 2s ease-out 0.5s forwards; stroke-dasharray:900; stroke-dashoffset:900; }
      .line-draw-v { animation: ldv 2s ease-out 0.5s forwards; stroke-dasharray:380; stroke-dashoffset:380; }
      @keyframes ldh { to{stroke-dashoffset:0} }
      @keyframes ldv { to{stroke-dashoffset:0} }

      .data-flow { animation: df 4s linear infinite; }
      .data-flow-2 { animation: df 6s linear infinite 1.5s; }
      .data-flow-3 { animation: df 5s linear infinite 3s; }
      @keyframes df {
        0% { stroke-dashoffset: 200; opacity:0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#mainClip)">
    <!-- Background -->
    <rect width="900" height="380" fill="url(#bgGrad)"/>
    <rect width="900" height="380" fill="url(#centerGlow)"/>

    <!-- Subtle grid -->
    <g class="grid-pulse">
      <path d="M0,38 L900,38 M0,76 L900,76 M0,114 L900,114 M0,152 L900,152 M0,190 L900,190 M0,228 L900,228 M0,266 L900,266 M0,304 L900,304 M0,342 L900,342"
        stroke="#D4AF37" stroke-width="0.3" fill="none"/>
      <path d="M90,0 L90,380 M180,0 L180,380 M270,0 L270,380 M360,0 L360,380 M450,0 L450,380 M540,0 L540,380 M630,0 L630,380 M720,0 L720,380 M810,0 L810,380"
        stroke="#D4AF37" stroke-width="0.3" fill="none"/>
    </g>

    <!-- Corner frame lines -->
    <g stroke="#D4AF37" fill="none">
      <!-- TL -->
      <line class="line-draw-h" x1="20" y1="20" x2="100" y2="20" stroke-width="1.5"/>
      <line class="line-draw-v" x1="20" y1="20" x2="20" y2="100" stroke-width="1.5"/>
      <rect x="16" y="16" width="5" height="5" fill="#D4AF37" class="pulse-a"/>
      <!-- TR -->
      <line class="line-draw-h" x1="800" y1="20" x2="880" y2="20" stroke-width="1.5"/>
      <line class="line-draw-v" x1="880" y1="20" x2="880" y2="100" stroke-width="1.5"/>
      <rect x="879" y="16" width="5" height="5" fill="#D4AF37" class="pulse-b"/>
      <!-- BL -->
      <line class="line-draw-h" x1="20" y1="360" x2="100" y2="360" stroke-width="1.5"/>
      <line class="line-draw-v" x1="20" y1="280" x2="20" y2="360" stroke-width="1.5"/>
      <rect x="16" y="359" width="5" height="5" fill="#D4AF37" class="pulse-b"/>
      <!-- BR -->
      <line class="line-draw-h" x1="800" y1="360" x2="880" y2="360" stroke-width="1.5"/>
      <line class="line-draw-v" x1="880" y1="280" x2="880" y2="360" stroke-width="1.5"/>
      <rect x="879" y="359" width="5" height="5" fill="#D4AF37" class="pulse-a"/>
    </g>

    <!-- Orbital rings (left side ecosystem visualization) -->
    <g opacity="0.12" class="fade-in-2">
      <circle cx="155" cy="190" r="110" stroke="#D4AF37" stroke-width="0.6" fill="none" stroke-dasharray="4 6"/>
      <circle cx="155" cy="190" r="75" stroke="#D4AF37" stroke-width="0.6" fill="none" stroke-dasharray="3 8"/>
      <circle cx="155" cy="190" r="42" stroke="#D4AF37" stroke-width="0.8" fill="none"/>
      <!-- Center dot -->
      <circle cx="155" cy="190" r="5" fill="#D4AF37" opacity="6"/>
    </g>

    <!-- Orbital nodes -->
    <g class="fade-in-3" opacity="0.7">
      <!-- Node at top of outer ring -->
      <g class="pulse-a">
        <circle cx="155" cy="80" r="4" fill="#D4AF37" opacity="0.6"/>
        <circle cx="155" cy="80" r="8" fill="url(#nodeGlow)"/>
        <text x="135" y="68" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.7">OKBOND</text>
      </g>
      <!-- Node at right -->
      <g class="pulse-b">
        <circle cx="265" cy="190" r="4" fill="#D4AF37" opacity="0.6"/>
        <circle cx="265" cy="190" r="8" fill="url(#nodeGlow)"/>
        <text x="270" y="193" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.7">ORAKZAIX</text>
      </g>
      <!-- Node at bottom -->
      <g class="pulse-c">
        <circle cx="155" cy="300" r="4" fill="#D4AF37" opacity="0.6"/>
        <circle cx="155" cy="300" r="8" fill="url(#nodeGlow)"/>
        <text x="118" y="316" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.7">PROPERTIES</text>
      </g>
      <!-- Node at left -->
      <g class="pulse-a">
        <circle cx="45" cy="190" r="4" fill="#D4AF37" opacity="0.6"/>
        <circle cx="45" cy="190" r="8" fill="url(#nodeGlow)"/>
        <text x="20" y="181" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.7">SHAMIM</text>
        <text x="18" y="189" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.7">FOREVER</text>
      </g>
      <!-- Inner nodes -->
      <circle cx="155" cy="115" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-b"/>
      <circle cx="220" cy="155" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-c"/>
      <circle cx="220" cy="225" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-a"/>
      <circle cx="155" cy="265" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-b"/>
      <circle cx="90" cy="225" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-c"/>
      <circle cx="90" cy="155" r="2.5" fill="#D4AF37" opacity="0.4" class="pulse-a"/>
      <!-- Center core -->
      <circle cx="155" cy="190" r="8" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5" class="pulse-a"/>
      <circle cx="155" cy="190" r="3" fill="#D4AF37" opacity="0.8"/>
    </g>

    <!-- Data flow lines on right side -->
    <g class="fade-in-4" opacity="0.25">
      <line x1="700" y1="60" x2="700" y2="320" stroke="#D4AF37" stroke-width="0.4"/>
      <line x1="730" y1="40" x2="730" y2="340" stroke="#D4AF37" stroke-width="0.4"/>
      <line x1="760" y1="60" x2="760" y2="320" stroke="#D4AF37" stroke-width="0.4"/>
      <line x1="790" y1="40" x2="790" y2="340" stroke="#D4AF37" stroke-width="0.4"/>
      <line x1="820" y1="60" x2="820" y2="320" stroke="#D4AF37" stroke-width="0.4"/>
      <line x1="850" y1="80" x2="850" y2="300" stroke="#D4AF37" stroke-width="0.4"/>

      <!-- Animated data packets -->
      <line x1="700" y1="0" x2="700" y2="40" stroke="#F5D060" stroke-width="1.5" stroke-dasharray="15 200" class="data-flow"/>
      <line x1="730" y1="0" x2="730" y2="40" stroke="#F5D060" stroke-width="1.5" stroke-dasharray="12 200" class="data-flow-2"/>
      <line x1="760" y1="0" x2="760" y2="40" stroke="#F5D060" stroke-width="1.5" stroke-dasharray="18 200" class="data-flow-3"/>
      <line x1="790" y1="0" x2="790" y2="40" stroke="#F5D060" stroke-width="1.5" stroke-dasharray="10 200" class="data-flow"/>
      <line x1="820" y1="0" x2="820" y2="40" stroke="#F5D060" stroke-width="1.5" stroke-dasharray="14 200" class="data-flow-2"/>
    </g>

    <!-- Scan line effect -->
    <g class="scan">
      <rect x="0" y="0" width="900" height="1.5" fill="url(#goldLine)"/>
    </g>

    <!-- ═══ MAIN CONTENT ═══ -->

    <!-- Sovereign mark — top -->
    <g class="fade-in-1">
      <text x="450" y="55" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="7" letter-spacing="8" fill="#D4AF37" opacity="0.6">
        ◈ &nbsp; ORAKZAI &nbsp; GROUP &nbsp; · &nbsp; SOVEREIGN &nbsp; DIGITAL &nbsp; INFRASTRUCTURE &nbsp; ◈
      </text>
    </g>

    <!-- Crown/diamond mark above name -->
    <g class="fade-in-2" filter="url(#goldGlow)">
      <polygon points="450,76 456,88 450,84 444,88" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.8"/>
      <circle cx="450" cy="74" r="2" fill="#D4AF37" opacity="0.9"/>
    </g>

    <!-- Main name — ultra premium typography -->
    <g class="fade-in-2" filter="url(#softBloom)">
      <text x="450" y="145" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="46" font-weight="800" letter-spacing="6"
        fill="url(#textGold)">MUHAMMAD FAISAL</text>
    </g>
    <g class="fade-in-2">
      <text x="450" y="145" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="46" font-weight="800" letter-spacing="6"
        fill="url(#textGold)" opacity="0.95">MUHAMMAD FAISAL</text>
    </g>

    <g class="fade-in-3" filter="url(#softBloom)">
      <text x="450" y="195" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="46" font-weight="800" letter-spacing="14"
        fill="url(#textGold)">ORAKZAI</text>
    </g>
    <g class="fade-in-3">
      <text x="450" y="195" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="46" font-weight="800" letter-spacing="14"
        fill="url(#textGold)" opacity="0.95">ORAKZAI</text>
    </g>

    <!-- Gold divider lines -->
    <g class="fade-in-3">
      <rect x="300" y="208" width="300" height="0.8" fill="url(#goldLine)"/>
    </g>

    <!-- Title row -->
    <g class="fade-in-4">
      <text x="450" y="235" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="10" font-weight="400" letter-spacing="5"
        fill="#A8A8A8">FOUNDER &amp; CEO · ORAKZAI GROUP</text>
    </g>

    <!-- Three pillars -->
    <g class="fade-in-4" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="2.5" fill="#D4AF37">
      <text x="330" y="262" text-anchor="middle" opacity="0.7">BLOCKCHAIN</text>
      <text x="450" y="262" text-anchor="middle" opacity="0.9">ARTIFICIAL INTELLIGENCE</text>
      <text x="570" y="262" text-anchor="middle" opacity="0.7">REAL ASSETS</text>
      <!-- Dots between -->
      <text x="390" y="262" text-anchor="middle" opacity="0.4">·</text>
      <text x="510" y="262" text-anchor="middle" opacity="0.4">·</text>
    </g>

    <!-- Location + Status -->
    <g class="fade-in-5">
      <text x="375" y="295" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="7" letter-spacing="2"
        fill="#555555">PAKISTAN → WORLD</text>
      <text x="527" y="295" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="7" letter-spacing="2"
        fill="#555555">STATUS: BUILDING</text>
      <rect class="blink" x="586" y="284" width="6" height="10" fill="#D4AF37" opacity="0.5"/>
      <!-- Separator dot -->
      <text x="450" y="295" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="7" fill="#D4AF37" opacity="0.35">·</text>
    </g>

    <!-- Bottom coordinates / identifiers -->
    <g class="fade-in-5" opacity="0.3">
      <text x="450" y="350" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="6.5" letter-spacing="3"
        fill="#D4AF37">[ github.com/faisalorakzai-lab · linkedin.com/in/faisalorakzaii ]</text>
    </g>
  </g>
</svg>
