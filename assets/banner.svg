<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050505"/>
    <stop offset="50%" stop-color="#0c0900"/>
    <stop offset="100%" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#FFF5C0" stop-opacity="1"/>
    <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
    <stop offset="45%" stop-color="#D4AF37" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF8DC" stop-opacity="0.9"/>
    <stop offset="55%" stop-color="#D4AF37" stop-opacity="0"/>
    <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="nameGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF5C0"/>
    <stop offset="40%" stop-color="#E8C84A"/>
    <stop offset="100%" stop-color="#8B6914"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5D060" stop-opacity="1"/>
    <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
  </radialGradient>
  <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feColorMatrix in="b" type="matrix"
      values="1.4 0.5 0 0 0  0.9 0.7 0 0 0  0 0 0.2 0 0  0 0 0 0.7 0" result="w"/>
    <feMerge><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="particleBlur">
    <feGaussianBlur stdDeviation="1.5"/>
  </filter>
  <mask id="shimmerMask">
    <rect width="900" height="360" fill="white"/>
  </mask>
  <clipPath id="clip"><rect width="900" height="360"/></clipPath>
  <style>
/* ── Particle network ── */
.p{animation:pm var(--d,8s) ease-in-out var(--delay,0s) infinite alternate;}
@keyframes pm{
  0%{transform:translate(var(--x0),var(--y0));}
  100%{transform:translate(var(--x1),var(--y1));}
}
.conn{animation:ca var(--d,8s) ease-in-out var(--delay,0s) infinite alternate;}
@keyframes ca{0%{opacity:var(--o0,0.4);}100%{opacity:var(--o1,0.1);}}

/* ── Shimmer sweep across text ── */
.shimmer-sweep{animation:shsw 4s cubic-bezier(0.4,0,0.6,1) infinite;}
@keyframes shsw{
  0%{transform:translateX(-900px);}
  40%,100%{transform:translateX(900px);}
}

/* ── Text entrance ── */
.t1{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;opacity:0;transform:translateY(20px);}
.t2{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;opacity:0;transform:translateY(20px);}
.t3{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;opacity:0;transform:translateY(20px);}
.t4{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;opacity:0;transform:translateY(20px);}
.t5{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 1.7s forwards;opacity:0;transform:translateY(20px);}
.t6{animation:tin 1.4s cubic-bezier(0.16,1,0.3,1) 2.1s forwards;opacity:0;transform:translateY(20px);}
@keyframes tin{
  to{opacity:1;transform:translateY(0);}
}

/* ── Corner pulse ── */
.cA{animation:cpA 2.8s ease-in-out infinite;}
.cB{animation:cpA 2.8s ease-in-out 0.9s infinite;}
.cC{animation:cpA 2.8s ease-in-out 1.8s infinite;}
@keyframes cpA{0%,100%{opacity:0.4;r:3;}50%{opacity:1;r:5;}}

/* ── Border travel ── */
.border-light{animation:btravel 6s linear infinite;}
@keyframes btravel{
  0%{stroke-dashoffset:2520;}
  100%{stroke-dashoffset:0;}
}

/* ── Hex grid pulse ── */
.hx{animation:hxp 5s ease-in-out var(--hd,0s) infinite;}
@keyframes hxp{0%,100%{opacity:0.03;}50%{opacity:0.09;}}

/* ── Data line flow ── */
.dl{stroke-dasharray:30 300;animation:dlf var(--dd,7s) linear var(--dly,0s) infinite;}
@keyframes dlf{from{stroke-dashoffset:330;}to{stroke-dashoffset:0;}}

/* ── Scan line ── */
.scan{animation:scanA 5s linear infinite;}
@keyframes scanA{
  0%{transform:translateY(-2px);opacity:0;}
  3%{opacity:0.6;}
  97%{opacity:0.6;}
  100%{transform:translateY(362px);opacity:0;}
}

/* ── Status blink ── */
.blink{animation:blk 1.2s step-end infinite;}
@keyframes blk{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── Ambient glow pulse ── */
.glow-pulse{animation:gp 4s ease-in-out infinite;}
@keyframes gp{0%,100%{opacity:0.15;}50%{opacity:0.35;}}
  </style>
</defs>
<g clip-path="url(#clip)">

<!-- Background -->
<rect width="900" height="360" fill="url(#bg)"/>
<rect width="900" height="360" fill="url(#vignette)"/>

<!-- Hex grid background -->
<g fill="none" stroke="#D4AF37" stroke-width="0.4">
  <!-- Left cluster -->
  <polygon class="hx" style="--hd:0s" points="80,60 100,49 120,60 120,82 100,93 80,82"/>
  <polygon class="hx" style="--hd:0.6s" points="120,60 140,49 160,60 160,82 140,93 120,82"/>
  <polygon class="hx" style="--hd:1.2s" points="80,104 100,93 120,104 120,126 100,137 80,126"/>
  <polygon class="hx" style="--hd:1.8s" points="120,104 140,93 160,104 160,126 140,137 120,126"/>
  <polygon class="hx" style="--hd:0.9s" points="80,148 100,137 120,148 120,170 100,181 80,170"/>
  <polygon class="hx" style="--hd:2.4s" points="100,28 120,17 140,28 140,50 120,61 100,50"/>
  <!-- Right cluster -->
  <polygon class="hx" style="--hd:0.3s" points="740,60 760,49 780,60 780,82 760,93 740,82"/>
  <polygon class="hx" style="--hd:0.9s" points="780,60 800,49 820,60 820,82 800,93 780,82"/>
  <polygon class="hx" style="--hd:1.5s" points="820,60 840,49 860,60 860,82 840,93 820,82"/>
  <polygon class="hx" style="--hd:2.1s" points="740,104 760,93 780,104 780,126 760,137 740,126"/>
  <polygon class="hx" style="--hd:0.6s" points="780,104 800,93 820,104 820,126 800,137 780,126"/>
  <polygon class="hx" style="--hd:1.2s" points="820,104 840,93 860,104 860,126 840,137 820,126"/>
  <polygon class="hx" style="--hd:1.8s" points="740,148 760,137 780,148 780,170 760,181 740,170"/>
  <polygon class="hx" style="--hd:2.7s" points="760,28 780,17 800,28 800,50 780,61 760,50"/>
</g>

<!-- Data flow lines -->
<g stroke="#D4AF37" fill="none" stroke-width="0.7" opacity="0.25">
  <line class="dl" style="--dd:8s;--dly:0s" x1="170" y1="120" x2="450" y2="120"/>
  <line class="dl" style="--dd:11s;--dly:2s" x1="450" y1="240" x2="730" y2="240"/>
  <line class="dl" style="--dd:9s;--dly:4s" x1="170" y1="200" x2="450" y2="200"/>
  <line class="dl" style="--dd:7s;--dly:1s" x1="450" y1="160" x2="730" y2="160"/>
</g>

<!-- Particle network (left side) -->
<!-- Particles -->
<g filter="url(#particleBlur)">
  <circle class="p" style="--x0:0px;--y0:0px;--x1:8px;--y1:12px;--d:9s;--delay:0s" cx="90" cy="100" r="2.5" fill="#F5D060" opacity="0.7"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:-6px;--y1:10px;--d:11s;--delay:1s" cx="130" cy="160" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:12px;--y1:-8px;--d:8s;--delay:2s" cx="70" cy="220" r="2.5" fill="#F5D060" opacity="0.5"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:-10px;--y1:14px;--d:13s;--delay:0.5s" cx="110" cy="270" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:6px;--y1:-12px;--d:10s;--delay:3s" cx="150" cy="310" r="1.8" fill="#E8C84A" opacity="0.5"/>
  <!-- Right side particles -->
  <circle class="p" style="--x0:0px;--y0:0px;--x1:-8px;--y1:10px;--d:9s;--delay:1.5s" cx="810" cy="100" r="2.5" fill="#F5D060" opacity="0.7"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:6px;--y1:14px;--d:12s;--delay:0s" cx="770" cy="160" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:-12px;--y1:-8px;--d:8s;--delay:2.5s" cx="830" cy="220" r="2.5" fill="#F5D060" opacity="0.5"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:10px;--y1:12px;--d:14s;--delay:1s" cx="790" cy="270" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle class="p" style="--x0:0px;--y0:0px;--x1:-6px;--y1:-14px;--d:10s;--delay:3.5s" cx="750" cy="310" r="1.8" fill="#E8C84A" opacity="0.5"/>
</g>

<!-- Connecting lines between particles -->
<g stroke="#D4AF37" stroke-width="0.5" opacity="0.2">
  <line class="conn" style="--d:9s;--delay:0s;--o0:0.4;--o1:0.1" x1="90" y1="100" x2="130" y2="160"/>
  <line class="conn" style="--d:11s;--delay:1s;--o0:0.2;--o1:0.5" x1="130" y1="160" x2="70" y2="220"/>
  <line class="conn" style="--d:8s;--delay:2s;--o0:0.5;--o1:0.1" x1="70" y1="220" x2="110" y2="270"/>
  <line class="conn" style="--d:10s;--delay:0.5s;--o0:0.3;--o1:0.6" x1="110" y1="270" x2="150" y2="310"/>
  <line class="conn" style="--d:9s;--delay:1.5s;--o0:0.4;--o1:0.1" x1="810" y1="100" x2="770" y2="160"/>
  <line class="conn" style="--d:12s;--delay:0s;--o0:0.2;--o1:0.5" x1="770" y1="160" x2="830" y2="220"/>
  <line class="conn" style="--d:8s;--delay:2.5s;--o0:0.5;--o1:0.15" x1="830" y1="220" x2="790" y2="270"/>
  <line class="conn" style="--d:10s;--delay:1s;--o0:0.3;--o1:0.6" x1="790" y1="270" x2="750" y2="310"/>
</g>

<!-- Animated border (traveling light) -->
<rect x="18" y="18" width="864" height="324" rx="2" fill="none"
  stroke="#D4AF37" stroke-width="0.4" stroke-dasharray="2520"
  class="border-light" opacity="0.2"/>

<!-- Hard corner marks -->
<g stroke="#D4AF37" fill="#D4AF37">
  <rect x="17" y="17" width="60" height="1.5" opacity="0.7"/>
  <rect x="17" y="17" width="1.5" height="60" opacity="0.7"/>
  <rect x="823" y="17" width="60" height="1.5" opacity="0.7"/>
  <rect x="881.5" y="17" width="1.5" height="60" opacity="0.7"/>
  <rect x="17" y="341.5" width="60" height="1.5" opacity="0.7"/>
  <rect x="17" y="282" width="1.5" height="60" opacity="0.7"/>
  <rect x="823" y="341.5" width="60" height="1.5" opacity="0.7"/>
  <rect x="881.5" y="282" width="1.5" height="60" opacity="0.7"/>
  <!-- Corner dots -->
  <circle class="cA" cx="17" cy="17" r="3" opacity="0.8"/>
  <circle class="cB" cx="883" cy="17" r="3" opacity="0.8"/>
  <circle class="cC" cx="17" cy="343" r="3" opacity="0.8"/>
  <circle class="cA" cx="883" cy="343" r="3" opacity="0.8"/>
</g>

<!-- Ambient center glow -->
<ellipse class="glow-pulse" cx="450" cy="180" rx="200" ry="100" fill="#D4AF37" opacity="0.15"/>

<!-- Scan line -->
<g class="scan">
  <rect x="0" y="0" width="900" height="1.5" fill="url(#goldH)"/>
</g>

<!-- ════ CONTENT ════ -->

<!-- Top identifier -->
<g class="t1">
  <text x="450" y="52" text-anchor="middle"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="7" letter-spacing="7" fill="#D4AF37" opacity="0.55">
    ◈ &nbsp; ORAKZAI GROUP &nbsp; · &nbsp; SOVEREIGN DIGITAL INFRASTRUCTURE &nbsp; ◈
  </text>
</g>

<!-- Main name block with shimmer -->
<g class="t2" filter="url(#bloom)">
  <text x="450" y="138" text-anchor="middle"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="44" font-weight="800" letter-spacing="5"
    fill="url(#nameGold)">MUHAMMAD FAISAL</text>
</g>
<!-- Shimmer sweep layer -->
<g class="t2" opacity="0.8">
  <clipPath id="nameClip1">
    <text x="450" y="138" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="44" font-weight="800" letter-spacing="5">MUHAMMAD FAISAL</text>
  </clipPath>
  <rect clip-path="url(#nameClip1)" x="0" y="90" width="80" height="60"
    fill="url(#shimmer)" opacity="0.7" class="shimmer-sweep"/>
</g>

<g class="t3" filter="url(#bloom)">
  <text x="450" y="190" text-anchor="middle"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="44" font-weight="800" letter-spacing="16"
    fill="url(#nameGold)">ORAKZAI</text>
</g>
<g class="t3" opacity="0.8">
  <clipPath id="nameClip2">
    <text x="450" y="190" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="44" font-weight="800" letter-spacing="16">ORAKZAI</text>
  </clipPath>
  <rect clip-path="url(#nameClip2)" x="0" y="145" width="80" height="60"
    fill="url(#shimmer)" opacity="0.7" class="shimmer-sweep"/>
</g>

<!-- Divider -->
<g class="t3">
  <rect x="310" y="202" width="280" height="0.8" fill="url(#goldH)" opacity="0.9"/>
</g>

<!-- Title -->
<g class="t4">
  <text x="450" y="228" text-anchor="middle"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="10" letter-spacing="5" font-weight="300"
    fill="#9A9A9A">FOUNDER &amp; CEO · ORAKZAI GROUP</text>
</g>

<!-- Three pillars -->
<g class="t5" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" letter-spacing="3" fill="#D4AF37" opacity="0.65">
  <text x="310" y="258" text-anchor="middle">BLOCKCHAIN</text>
  <text x="450" y="258" text-anchor="middle">AI &amp; INTELLIGENCE</text>
  <text x="590" y="258" text-anchor="middle">REAL ASSETS</text>
  <text x="380" y="258" text-anchor="middle" opacity="0.4">·</text>
  <text x="520" y="258" text-anchor="middle" opacity="0.4">·</text>
</g>

<!-- Status row -->
<g class="t6">
  <text x="378" y="294" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="7.5" letter-spacing="2"
    fill="#555">PAKISTAN → WORLD</text>
  <rect class="blink" x="430" y="283" width="6" height="11" fill="#D4AF37" opacity="0.6"/>
  <text x="527" y="294" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="7.5" letter-spacing="2"
    fill="#555">STATUS: LIVE</text>
  <text x="450" y="294" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="7.5" fill="#D4AF37" opacity="0.3">·</text>
</g>

<!-- LinkedIn footer -->
<g class="t6" opacity="0.3">
  <text x="450" y="334" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="6.5" letter-spacing="2.5"
    fill="#D4AF37">[ github.com/faisalorakzai-lab · linkedin.com/in/faisalorakzaii ]</text>
</g>

</g>
</svg>
