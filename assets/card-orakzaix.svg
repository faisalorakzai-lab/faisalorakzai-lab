<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="60" y2="30" stroke="#D4AF37" stroke-width="0.12" opacity="0.2"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#D4AF37" stroke-width="0.12" opacity="0.2"/>
      <circle cx="30" cy="30" r="1.5" fill="#D4AF37" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#D4AF37" opacity="0.08"/>
    </pattern>
    <radialGradient id="aiGlow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .neural-pulse { animation: nPulse 4s ease-in-out infinite; }
      @keyframes nPulse { 0%,100%{opacity:0.1} 50%{opacity:0.25} }
      .scan-h { animation: scanH 5s linear infinite; }
      @keyframes scanH { 0%{transform:translateX(-860px);opacity:0} 5%{opacity:0.5} 95%{opacity:0.5} 100%{transform:translateX(860px);opacity:0} }
      .ai-ring-1 { animation: aiSpin1 10s linear infinite; transform-origin:680px 220px; }
      .ai-ring-2 { animation: aiSpin2 16s linear infinite; transform-origin:680px 220px; }
      .ai-ring-3 { animation: aiSpin3 7s linear infinite; transform-origin:680px 220px; }
      @keyframes aiSpin1 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes aiSpin2 { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
      @keyframes aiSpin3 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      .center-pulse { animation: cPulse 2.5s ease-in-out infinite; }
      @keyframes cPulse { 0%,100%{r:18;opacity:0.3} 50%{r:26;opacity:0.7} }
      .corner-glow { animation: cgPulse 3s ease-in-out infinite; }
      @keyframes cgPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      .appear { animation: appear 1s ease-out forwards; opacity:0; }
      .a1{animation-delay:0.2s}.a2{animation-delay:0.7s}.a3{animation-delay:1.1s}.a4{animation-delay:1.5s}
      @keyframes appear { from{opacity:0} to{opacity:1} }
      .data-v { animation: dataV 7s linear infinite; }
      .data-v2 { animation: dataV 9s linear infinite; animation-delay:-3s; }
      @keyframes dataV { 0%{transform:translateY(-440px);opacity:0} 8%{opacity:0.3} 92%{opacity:0.3} 100%{transform:translateY(440px);opacity:0} }
      .ticker { animation: tick 16s linear infinite; }
      @keyframes tick { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    </style>
  </defs>

  <rect width="860" height="440" fill="#000000"/>
  <rect width="860" height="440" fill="url(#circuitGrid)" class="neural-pulse"/>
  <rect width="860" height="440" fill="url(#aiGlow)"/>

  <!-- Vertical data flows -->
  <g class="data-v"><rect x="760" y="0" width="0.6" height="120" fill="#D4AF37" opacity="0.3"/></g>
  <g class="data-v2"><rect x="720" y="0" width="0.6" height="80" fill="#D4AF37" opacity="0.2"/></g>

  <!-- AI orb - right side decorative -->
  <!-- Outer glow rings -->
  <g class="ai-ring-1">
    <ellipse cx="680" cy="220" rx="110" ry="110" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.12" stroke-dasharray="8 16"/>
  </g>
  <g class="ai-ring-2">
    <ellipse cx="680" cy="220" rx="80" ry="80" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.18" stroke-dasharray="5 10"/>
  </g>
  <g class="ai-ring-3">
    <ellipse cx="680" cy="220" rx="50" ry="50" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25" stroke-dasharray="3 8"/>
  </g>
  <!-- Center orb -->
  <circle class="center-pulse" cx="680" cy="220" r="18" fill="#D4AF37"/>
  <circle cx="680" cy="220" r="18" fill="#000000" stroke="#D4AF37" stroke-width="1" opacity="0.9"/>
  <text x="680" y="224" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1"
    fill="#D4AF37">AI</text>
  <!-- Connection spokes -->
  <line x1="680" y1="110" x2="680" y2="145" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>
  <line x1="680" y1="295" x2="680" y2="330" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>
  <line x1="570" y1="220" x2="605" y2="220" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>
  <line x1="755" y1="220" x2="790" y2="220" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>
  <!-- Spoke nodes -->
  <circle cx="680" cy="108" r="4" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>
  <circle cx="680" cy="332" r="4" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>
  <circle cx="568" cy="220" r="4" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>
  <circle cx="792" cy="220" r="4" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.8" opacity="0.7"/>

  <!-- Corner brackets -->
  <g class="corner-glow">
    <line x1="24" y1="24" x2="70" y2="24" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="24" y1="24" x2="24" y2="70" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="836" y1="24" x2="790" y2="24" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="836" y1="24" x2="836" y2="70" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="24" y1="416" x2="70" y2="416" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="24" y1="416" x2="24" y2="370" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="836" y1="416" x2="790" y2="416" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="836" y1="416" x2="836" y2="370" stroke="#D4AF37" stroke-width="1.5"/>
  </g>

  <!-- Scan line horizontal -->
  <g class="scan-h">
    <rect x="0" y="0" width="860" height="1" fill="#D4AF37" opacity="0.4"/>
  </g>

  <!-- Content -->
  <g class="appear a1">
    <text x="80" y="72"
      font-family="'Courier New', Courier, monospace"
      font-size="9" letter-spacing="4" fill="#D4AF37" opacity="0.6">ORAKZAI ECOSYSTEM · INTELLIGENCE DIVISION</text>
  </g>
  <line x1="60" y1="82" x2="500" y2="82" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>

  <g class="appear a2" filter="url(#strongGlow)">
    <text x="80" y="168"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="65" font-weight="700" letter-spacing="4"
      fill="#D4AF37">ORAKZAI</text>
    <text x="80" y="224"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="40" font-weight="300" letter-spacing="8"
      fill="#F5F5F5">× AI</text>
  </g>

  <g class="appear a2">
    <rect x="80" y="236" width="320" height="1" fill="#D4AF37" opacity="0.8"/>
  </g>

  <g class="appear a3">
    <text x="80" y="262"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="11" font-weight="300" letter-spacing="4"
      fill="#D4AF37">AI · AUTOMATION · INTELLIGENCE SYSTEMS</text>
  </g>

  <g class="appear a3">
    <text x="80" y="300"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="12" font-weight="300" fill="#888888">AI-driven automation applied to financial</text>
    <text x="80" y="320"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="12" font-weight="300" fill="#888888">and operational infrastructure workflows.</text>
  </g>

  <g class="appear a4">
    <rect x="80" y="348" width="64" height="22" rx="2" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.5" opacity="0.7"/>
    <text x="112" y="363" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" letter-spacing="2" fill="#D4AF37">AI</text>

    <rect x="156" y="348" width="104" height="22" rx="2" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.5" opacity="0.7"/>
    <text x="208" y="363" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" letter-spacing="2" fill="#D4AF37">AUTOMATION</text>

    <rect x="272" y="348" width="84" height="22" rx="2" fill="#0A0A0A" stroke="#D4AF37" stroke-width="0.5" opacity="0.7"/>
    <text x="314" y="363" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" letter-spacing="2" fill="#D4AF37">FINTECH</text>
  </g>

  <!-- Ticker -->
  <rect x="0" y="398" width="860" height="26" fill="#0A0A0A"/>
  <line x1="0" y1="398" x2="860" y2="398" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  <g class="ticker">
    <text y="415" font-family="'Courier New', monospace" font-size="9" letter-spacing="2" fill="#D4AF37" opacity="0.6">
      <tspan x="20">ORAKZAIX · ARTIFICIAL INTELLIGENCE · AUTOMATION SYSTEMS · AI INFRASTRUCTURE · MACHINE INTELLIGENCE · </tspan>
      <tspan>ORAKZAIX · ARTIFICIAL INTELLIGENCE · AUTOMATION SYSTEMS · AI INFRASTRUCTURE · MACHINE INTELLIGENCE · </tspan>
    </text>
  </g>
</svg>
