<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#060400"/>
    <stop offset="100%" stop-color="#0D0900"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#FFF5A0" stop-opacity="1"/>
    <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shimG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="48%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF8DC" stop-opacity="0.8"/>
    <stop offset="52%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF5C0"/>
    <stop offset="100%" stop-color="#C8982A"/>
  </linearGradient>
  <radialGradient id="cg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
.btl{stroke-dasharray:1280;animation:bt 5s linear 0.5s infinite;}
@keyframes bt{0%{stroke-dashoffset:1280;}100%{stroke-dashoffset:0;}}
/* Neural network node pulse */
.nn{animation:nnp var(--nd,3s) ease-in-out var(--ndy,0s) infinite;}
@keyframes nnp{0%,100%{opacity:0.2;r:var(--r0,3);}50%{opacity:0.8;r:var(--r1,5);}}
.nl{animation:nlp var(--nd,4s) ease-in-out var(--ndy,0s) infinite;}
@keyframes nlp{0%,100%{opacity:0.08;}50%{opacity:0.35;}}
/* Signal pulse along line */
.sig{stroke-dasharray:8 300;animation:sig var(--sd,5s) linear var(--sdy,0s) infinite;}
@keyframes sig{from{stroke-dashoffset:308;}to{stroke-dashoffset:0;}}
.shsw{animation:shsw 5s cubic-bezier(0.4,0,0.6,1) 2.5s infinite;}
@keyframes shsw{0%{transform:translateX(-420px);}40%,100%{transform:translateX(420px);}}
.bar{animation:bf 2s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;transform-origin:left;}
@keyframes bf{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.e1{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;opacity:0;}
.e2{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;opacity:0;}
.e3{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;opacity:0;}
.e4{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 1.0s forwards;opacity:0;}
@keyframes ei{to{opacity:1;}}
.cb{animation:cb 3s ease-in-out var(--cd,0s) infinite;}
@keyframes cb{0%,100%{opacity:0.5;}50%{opacity:1;}}
.status-build{animation:sbp 2s ease-in-out infinite;}
@keyframes sbp{0%,100%{opacity:0.6;}50%{opacity:1;}}
  </style>
</defs>
<rect width="420" height="220" fill="url(#bg)"/>
<rect width="420" height="220" fill="url(#cg)"/>

<!-- Neural network visualization (right side) -->
<!-- Nodes layer 1 -->
<g>
  <circle class="nn" style="--nd:4s;--ndy:0s;--r0:3;--r1:5" cx="340" cy="55" r="3" fill="#D4AF37" filter="url(#glow)"/>
  <circle class="nn" style="--nd:5s;--ndy:0.5s;--r0:2.5;--r1:4" cx="340" cy="105" r="2.5" fill="#D4AF37" filter="url(#glow)"/>
  <circle class="nn" style="--nd:4.5s;--ndy:1s;--r0:3;--r1:5" cx="340" cy="155" r="3" fill="#D4AF37" filter="url(#glow)"/>
</g>
<!-- Nodes layer 2 -->
<g>
  <circle class="nn" style="--nd:3.5s;--ndy:0.3s;--r0:3;--r1:5" cx="375" cy="70" r="3" fill="#F5D060" filter="url(#glow)"/>
  <circle class="nn" style="--nd:6s;--ndy:0.8s;--r0:2.5;--r1:4" cx="375" cy="130" r="2.5" fill="#F5D060" filter="url(#glow)"/>
</g>
<!-- Node layer 3 -->
<g>
  <circle class="nn" style="--nd:4s;--ndy:1.2s;--r0:3;--r1:5" cx="408" cy="90" r="3" fill="#D4AF37" filter="url(#glow)"/>
  <circle class="nn" style="--nd:5s;--ndy:0.2s;--r0:2.5;--r1:4" cx="408" cy="160" r="2.5" fill="#D4AF37" filter="url(#glow)"/>
</g>
<!-- Connections -->
<g stroke="#D4AF37" fill="none" stroke-width="0.5">
  <line class="nl" style="--nd:4s;--ndy:0s" x1="340" y1="55" x2="375" y2="70"/>
  <line class="nl" style="--nd:5s;--ndy:0.5s" x1="340" y1="105" x2="375" y2="70"/>
  <line class="nl" style="--nd:4.5s;--ndy:1s" x1="340" y1="105" x2="375" y2="130"/>
  <line class="nl" style="--nd:6s;--ndy:0.3s" x1="340" y1="155" x2="375" y2="130"/>
  <line class="nl" style="--nd:3.5s;--ndy:0.8s" x1="375" y1="70" x2="408" y2="90"/>
  <line class="nl" style="--nd:5.5s;--ndy:1.2s" x1="375" y1="130" x2="408" y2="90"/>
  <line class="nl" style="--nd:4s;--ndy:0.2s" x1="375" y1="130" x2="408" y2="160"/>
</g>
<!-- Signal pulses -->
<g stroke="#FFF5A0" fill="none" stroke-width="1.2">
  <line class="sig" style="--sd:4s;--sdy:0s" x1="340" y1="55" x2="375" y2="70"/>
  <line class="sig" style="--sd:5s;--sdy:1.5s" x1="340" y1="105" x2="375" y2="130"/>
  <line class="sig" style="--sd:4.5s;--sdy:3s" x1="375" y1="70" x2="408" y2="90"/>
</g>

<!-- Border -->
<rect class="btl" x="1" y="1" width="418" height="218" rx="2" fill="none" stroke="url(#goldH)" stroke-width="1.5" opacity="0.7"/>
<rect x="1" y="1" width="418" height="218" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
<!-- Corners -->
<g stroke="#D4AF37" stroke-width="1.5" fill="#D4AF37">
  <line x1="12" y1="12" x2="32" y2="12" opacity="0.8"/><line x1="12" y1="12" x2="12" y2="32" opacity="0.8"/>
  <line x1="388" y1="12" x2="408" y2="12" opacity="0.8"/><line x1="408" y1="12" x2="408" y2="32" opacity="0.8"/>
  <line x1="12" y1="208" x2="32" y2="208" opacity="0.8"/><line x1="12" y1="188" x2="12" y2="208" opacity="0.8"/>
  <line x1="388" y1="208" x2="408" y2="208" opacity="0.8"/><line x1="408" y1="188" x2="408" y2="208" opacity="0.8"/>
  <circle class="cb" style="--cd:0s" cx="12" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:0.75s" cx="408" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:1.5s" cx="12" cy="208" r="2.5"/>
  <circle class="cb" style="--cd:2.25s" cx="408" cy="208" r="2.5"/>
</g>
<!-- Shimmer -->
<clipPath id="cc2"><rect x="1" y="1" width="418" height="218" rx="2"/></clipPath>
<rect clip-path="url(#cc2)" x="0" y="0" width="50" height="220" fill="url(#shimG)" opacity="0.6" class="shsw"/>

<!-- Content -->
<g class="e1">
  <rect x="24" y="20" width="48" height="16" rx="3" fill="#111" stroke="#D4AF37" stroke-width="0.7"/>
  <text x="48" y="31" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#D4AF37">AI SYS</text>
  <rect x="80" y="20" width="72" height="16" rx="3" fill="#0D0D1A" stroke="#D4AF37" stroke-width="0.7"/>
  <circle class="status-build" cx="92" cy="28" r="3.5" fill="#D4AF37"/>
  <text x="120" y="31" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#D4AF37">BUILDING</text>
</g>
<g class="e2" filter="url(#tg)">
  <text x="24" y="72" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="url(#nameGrad)">ORAKZAIX</text>
</g>
<g class="e3">
  <text x="24" y="94" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.5" letter-spacing="2.5" fill="#888">MULTI-AGENT AI INTELLIGENCE</text>
</g>
<g class="e3"><rect x="24" y="104" width="200" height="0.7" fill="url(#goldH)" opacity="0.6"/></g>
<g class="e4" font-family="'Courier New',monospace">
  <text x="24" y="124" font-size="7.5" letter-spacing="1" fill="#666">ENGINE</text>
  <text x="110" y="124" font-size="7.5" fill="#D4AF37">GPT-4O + CLAUDE 3.5</text>
  <text x="24" y="140" font-size="7.5" letter-spacing="1" fill="#666">FRAMEWORK</text>
  <text x="110" y="140" font-size="7.5" fill="#D4AF37">LANGGRAPH + CREWAI</text>
  <text x="24" y="156" font-size="7.5" letter-spacing="1" fill="#666">MEMORY</text>
  <text x="110" y="156" font-size="7.5" fill="#D4AF37">VECTOR DB (PGVECTOR)</text>
  <text x="24" y="172" font-size="7.5" letter-spacing="1" fill="#666">AGENTS</text>
  <text x="110" y="172" font-size="7.5" fill="#D4AF37">6 SPECIALIZED MODULES</text>
</g>
<g class="e4">
  <rect x="24" y="190" width="270" height="2" rx="1" fill="#1A1500"/>
  <rect class="bar" x="24" y="190" width="178" height="2" rx="1" fill="#D4AF37" opacity="0.8"/>
  <text x="24" y="205" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#555">BUILD PROGRESS</text>
  <text x="295" y="205" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#D4AF37">66%</text>
</g>
</svg>
