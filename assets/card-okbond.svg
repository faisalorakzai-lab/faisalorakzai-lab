<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#060400"/>
    <stop offset="100%" stop-color="#0D0900"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#FFF5A0" stop-opacity="1"/>
    <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shimG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="48%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF8DC" stop-opacity="0.8"/>
    <stop offset="52%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF5C0"/>
    <stop offset="100%" stop-color="#C8982A"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
/* Border travel */
.btl{stroke-dasharray:1280;animation:bt 5s linear infinite;}
@keyframes bt{0%{stroke-dashoffset:1280;}100%{stroke-dashoffset:0;}}
/* Status pulse */
.sp{animation:sp 1.8s ease-in-out infinite;}
@keyframes sp{0%,100%{opacity:0.5;r:4;}50%{opacity:1;r:6;}}
.spR{animation:sp 1.8s ease-in-out infinite;}
/* Data nodes pulse */
.np{animation:np 3s ease-in-out var(--nd,0s) infinite;}
@keyframes np{0%,100%{opacity:0.3;}50%{opacity:1;}}
/* Shimmer sweep */
.shsw{animation:shsw 5s cubic-bezier(0.4,0,0.6,1) 2s infinite;}
@keyframes shsw{0%{transform:translateX(-420px);}40%,100%{transform:translateX(420px);}}
/* Bar fill animation */
.bar{animation:bf 2s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;transform-origin:left;}
@keyframes bf{from{transform:scaleX(0);}to{transform:scaleX(1);}}
/* Entrance */
.e1{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;opacity:0;}
.e2{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;opacity:0;}
.e3{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;opacity:0;}
.e4{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 1.0s forwards;opacity:0;}
@keyframes ei{to{opacity:1;}}
/* Particle float */
.pf{animation:pfl var(--pd,7s) ease-in-out var(--pdy,0s) infinite alternate;}
@keyframes pfl{0%{transform:translate(0,0);}100%{transform:translate(var(--px,5px),var(--py,-6px));}}
/* Corner blink */
.cb{animation:cb 3s ease-in-out var(--cd,0s) infinite;}
@keyframes cb{0%,100%{opacity:0.5;}50%{opacity:1;}}
/* Network line pulse */
.nlp{animation:nlp var(--nld,4s) ease-in-out var(--ndy,0s) infinite;}
@keyframes nlp{0%,100%{opacity:0.1;}50%{opacity:0.4;}}
  </style>
</defs>

<!-- Background -->
<rect width="420" height="220" fill="url(#bg)"/>
<rect width="420" height="220" fill="url(#centerGlow)"/>

<!-- Particle network (right side visualization) -->
<g opacity="0.5">
  <circle class="pf" style="--pd:8s;--pdy:0s;--px:6px;--py:-8px" cx="345" cy="65" r="2.5" fill="#F5D060" filter="url(#glow)"/>
  <circle class="pf" style="--pd:11s;--pdy:1s;--px:-5px;--py:7px" cx="375" cy="105" r="2" fill="#D4AF37" filter="url(#glow)"/>
  <circle class="pf" style="--pd:9s;--pdy:2s;--px:8px;--py:5px" cx="395" cy="155" r="2.5" fill="#F5D060" filter="url(#glow)"/>
  <circle class="pf" style="--pd:7s;--pdy:0.5s;--px:-7px;--py:-6px" cx="360" cy="185" r="2" fill="#D4AF37" filter="url(#glow)"/>
  <circle class="pf" style="--pd:13s;--pdy:3s;--px:4px;--py:9px" cx="405" cy="80" r="1.8" fill="#E8C84A" filter="url(#glow)"/>
</g>
<!-- Particle connections -->
<g stroke="#D4AF37" stroke-width="0.5">
  <line class="nlp" style="--nld:8s;--ndy:0s" x1="345" y1="65" x2="375" y2="105"/>
  <line class="nlp" style="--nld:9s;--ndy:1s" x1="375" y1="105" x2="395" y2="155"/>
  <line class="nlp" style="--nld:7s;--ndy:2s" x1="395" y1="155" x2="360" y2="185"/>
  <line class="nlp" style="--nld:11s;--ndy:0.5s" x1="345" y1="65" x2="405" y2="80"/>
  <line class="nlp" style="--nld:10s;--ndy:1.5s" x1="405" y1="80" x2="375" y2="105"/>
</g>

<!-- Animated border -->
<rect class="btl" x="1" y="1" width="418" height="218" rx="2" fill="none"
  stroke="url(#goldH)" stroke-width="1.5" opacity="0.7"/>

<!-- Static border -->
<rect x="1" y="1" width="418" height="218" rx="2" fill="none"
  stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>

<!-- Corner accents -->
<g stroke="#D4AF37" stroke-width="1.5" fill="#D4AF37">
  <line x1="12" y1="12" x2="32" y2="12" opacity="0.8"/>
  <line x1="12" y1="12" x2="12" y2="32" opacity="0.8"/>
  <line x1="388" y1="12" x2="408" y2="12" opacity="0.8"/>
  <line x1="408" y1="12" x2="408" y2="32" opacity="0.8"/>
  <line x1="12" y1="208" x2="32" y2="208" opacity="0.8"/>
  <line x1="12" y1="188" x2="12" y2="208" opacity="0.8"/>
  <line x1="388" y1="208" x2="408" y2="208" opacity="0.8"/>
  <line x1="408" y1="188" x2="408" y2="208" opacity="0.8"/>
  <circle class="cb" style="--cd:0s" cx="12" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:0.75s" cx="408" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:1.5s" cx="12" cy="208" r="2.5"/>
  <circle class="cb" style="--cd:2.25s" cx="408" cy="208" r="2.5"/>
</g>

<!-- Shimmer sweep overlay -->
<clipPath id="cardClip"><rect x="1" y="1" width="418" height="218" rx="2"/></clipPath>
<rect clip-path="url(#cardClip)" x="0" y="0" width="50" height="220"
  fill="url(#shimG)" opacity="0.6" class="shsw"/>

<!-- ══ Content ══ -->

<!-- Top badge row -->
<g class="e1">
  <!-- Chain badge -->
  <rect x="24" y="20" width="60" height="16" rx="3" fill="#111" stroke="#D4AF37" stroke-width="0.7" opacity="0.9"/>
  <text x="54" y="31" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="7" letter-spacing="1"
    fill="#D4AF37">POLYGON</text>
  <!-- Live badge -->
  <rect x="92" y="20" width="48" height="16" rx="3" fill="#0A1A0A" stroke="#00CC44" stroke-width="0.7" opacity="0.9"/>
  <circle class="sp" cx="103" cy="28" r="3.5" fill="#00CC44"/>
  <text x="123" y="31" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="7" letter-spacing="1"
    fill="#00CC44">LIVE</text>
</g>

<!-- Project name -->
<g class="e2" filter="url(#textGlow)">
  <text x="24" y="72" font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="32" font-weight="800" letter-spacing="4"
    fill="url(#nameGrad)">OKBOND</text>
</g>

<!-- Subtitle -->
<g class="e3">
  <text x="24" y="94" font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="8.5" letter-spacing="2.5" fill="#888">
    BLOCKCHAIN BOND MARKETPLACE
  </text>
</g>

<!-- Divider -->
<g class="e3">
  <rect x="24" y="104" width="200" height="0.7" fill="url(#goldH)" opacity="0.6"/>
</g>

<!-- Metric rows -->
<g class="e4" font-family="'Courier New',monospace">
  <!-- Row 1 -->
  <text x="24" y="124" font-size="7.5" letter-spacing="1" fill="#666">INSTRUMENT</text>
  <text x="160" y="124" font-size="7.5" fill="#D4AF37">ERC-1155 · MULTI-TOKEN</text>

  <!-- Row 2 -->
  <text x="24" y="140" font-size="7.5" letter-spacing="1" fill="#666">NETWORK</text>
  <text x="160" y="140" font-size="7.5" fill="#D4AF37">POLYGON POS + ZKEVM</text>

  <!-- Row 3 -->
  <text x="24" y="156" font-size="7.5" letter-spacing="1" fill="#666">SETTLEMENT</text>
  <text x="160" y="156" font-size="7.5" fill="#D4AF37">T+0 BLOCKCHAIN NATIVE</text>

  <!-- Row 4 -->
  <text x="24" y="172" font-size="7.5" letter-spacing="1" fill="#666">MARKET</text>
  <text x="160" y="172" font-size="7.5" fill="#D4AF37">DEFI / FIXED INCOME</text>
</g>

<!-- Bottom bar -->
<g class="e4">
  <rect x="24" y="190" width="270" height="2" rx="1" fill="#1A1500" opacity="0.9"/>
  <rect class="bar" x="24" y="190" width="200" height="2" rx="1" fill="#D4AF37" opacity="0.8"/>
  <text x="24" y="205" font-family="'Courier New',monospace" font-size="7"
    letter-spacing="1" fill="#555">BUILD PROGRESS</text>
  <text x="295" y="205" font-family="'Courier New',monospace" font-size="7"
    letter-spacing="1" fill="#D4AF37">74%</text>
</g>

</svg>
