<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .terminal-bg { fill: #000000; }
      .line1  { animation: revealLine 0.4s ease-out 0.3s forwards; opacity: 0; }
      .line2  { animation: revealLine 0.4s ease-out 0.9s forwards; opacity: 0; }
      .line3  { animation: revealLine 0.4s ease-out 1.5s forwards; opacity: 0; }
      .line4  { animation: revealLine 0.4s ease-out 2.1s forwards; opacity: 0; }
      .line5  { animation: revealLine 0.4s ease-out 2.7s forwards; opacity: 0; }
      .line6  { animation: revealLine 0.4s ease-out 3.3s forwards; opacity: 0; }
      .line7  { animation: revealLine 0.4s ease-out 3.9s forwards; opacity: 0; }
      .line8  { animation: revealLine 0.4s ease-out 4.5s forwards; opacity: 0; }
      .bar1   { animation: growBar 0.5s ease-out 1.0s forwards; transform: scaleX(0); transform-origin: left; }
      .bar2   { animation: growBar 0.5s ease-out 1.6s forwards; transform: scaleX(0); transform-origin: left; }
      .bar3   { animation: growBar 0.5s ease-out 2.2s forwards; transform: scaleX(0); transform-origin: left; }
      .bar4   { animation: growBar 0.5s ease-out 2.8s forwards; transform: scaleX(0); transform-origin: left; }
      .bar5   { animation: growBar 0.5s ease-out 3.4s forwards; transform: scaleX(0); transform-origin: left; }
      .status1 { animation: revealLine 0.3s ease-out 1.4s forwards; opacity: 0; }
      .status2 { animation: revealLine 0.3s ease-out 2.0s forwards; opacity: 0; }
      .status3 { animation: revealLine 0.3s ease-out 2.6s forwards; opacity: 0; }
      .status4 { animation: revealLine 0.3s ease-out 3.2s forwards; opacity: 0; }
      .status5 { animation: revealLine 0.3s ease-out 3.8s forwards; opacity: 0; }
      .final  { animation: revealLine 0.8s ease-out 5.0s forwards; opacity: 0; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes revealLine { from { opacity: 0; } to { opacity: 1; } }
      @keyframes growBar   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes blink     { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .corner { animation: cornerPulse 2s ease-in-out infinite; }
      @keyframes cornerPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#000000" rx="4"/>
  <!-- Subtle border -->
  <rect width="900" height="280" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3" rx="4"/>

  <!-- Corner accent dots -->
  <g class="corner">
    <circle cx="20" cy="20" r="3" fill="#D4AF37" opacity="0.7"/>
    <circle cx="880" cy="20" r="3" fill="#D4AF37" opacity="0.7"/>
    <circle cx="20" cy="260" r="3" fill="#D4AF37" opacity="0.7"/>
    <circle cx="880" cy="260" r="3" fill="#D4AF37" opacity="0.7"/>
  </g>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="36" fill="#0A0A0A" rx="4"/>
  <text x="450" y="23" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="10" letter-spacing="3" fill="#D4AF37" opacity="0.8">ORAKZAI NETWORK TERMINAL · v2.0.26</text>

  <!-- Divider -->
  <line x1="40" y1="48" x2="860" y2="48" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>

  <!-- Boot header line -->
  <g class="line1">
    <text x="60" y="80"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#888888">INITIALIZING ORAKZAI NETWORK SYSTEMS...</text>
  </g>

  <!-- Line: AI CORE -->
  <g class="line2">
    <text x="60" y="112"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="1" fill="#555555">AI CORE</text>
  </g>
  <g class="bar1">
    <rect x="220" y="103" width="300" height="8" rx="1" fill="#111111"/>
    <rect x="220" y="103" width="300" height="8" rx="1" fill="#D4AF37" opacity="0.15"/>
    <rect x="220" y="103" width="296" height="8" rx="1" fill="#D4AF37" opacity="0.7"/>
  </g>
  <g class="status1">
    <text x="540" y="112"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#D4AF37">ONLINE</text>
  </g>

  <!-- Line: BLOCKCHAIN LAYER -->
  <g class="line3">
    <text x="60" y="142"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="1" fill="#555555">BLOCKCHAIN LAYER</text>
  </g>
  <g class="bar2">
    <rect x="220" y="133" width="300" height="8" rx="1" fill="#111111"/>
    <rect x="220" y="133" width="300" height="8" rx="1" fill="#D4AF37" opacity="0.15"/>
    <rect x="220" y="133" width="296" height="8" rx="1" fill="#D4AF37" opacity="0.7"/>
  </g>
  <g class="status2">
    <text x="540" y="142"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#D4AF37">VERIFIED</text>
  </g>

  <!-- Line: DIGITAL ASSET ENGINE -->
  <g class="line4">
    <text x="60" y="172"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="1" fill="#555555">DIGITAL ASSET ENGINE</text>
  </g>
  <g class="bar3">
    <rect x="220" y="163" width="300" height="8" rx="1" fill="#111111"/>
    <rect x="220" y="163" width="300" height="8" rx="1" fill="#D4AF37" opacity="0.15"/>
    <rect x="220" y="163" width="296" height="8" rx="1" fill="#D4AF37" opacity="0.7"/>
  </g>
  <g class="status3">
    <text x="540" y="172"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#D4AF37">ACTIVE</text>
  </g>

  <!-- Line: AUTOMATION SYSTEM -->
  <g class="line5">
    <text x="60" y="202"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="1" fill="#555555">AUTOMATION SYSTEM</text>
  </g>
  <g class="bar4">
    <rect x="220" y="193" width="300" height="8" rx="1" fill="#111111"/>
    <rect x="220" y="193" width="300" height="8" rx="1" fill="#D4AF37" opacity="0.15"/>
    <rect x="220" y="193" width="296" height="8" rx="1" fill="#D4AF37" opacity="0.7"/>
  </g>
  <g class="status4">
    <text x="540" y="202"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#D4AF37">RUNNING</text>
  </g>

  <!-- Line: GLOBAL STATUS -->
  <g class="line6">
    <text x="60" y="232"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="1" fill="#555555">GLOBAL STATUS</text>
  </g>
  <g class="bar5">
    <rect x="220" y="223" width="300" height="8" rx="1" fill="#111111"/>
    <rect x="220" y="223" width="300" height="8" rx="1" fill="#D4AF37" opacity="0.15"/>
    <rect x="220" y="223" width="296" height="8" rx="1" fill="#D4AF37" opacity="0.7"/>
  </g>
  <g class="status5">
    <text x="540" y="232"
      font-family="'Courier New', Courier, monospace"
      font-size="11" letter-spacing="2" fill="#D4AF37">OPERATIONAL</text>
  </g>

  <!-- Divider -->
  <g class="line7">
    <line x1="40" y1="248" x2="860" y2="248" stroke="#D4AF37" stroke-width="0.4" opacity="0.3"/>
  </g>

  <!-- Final status -->
  <g class="final">
    <text x="60" y="265"
      font-family="'Courier New', Courier, monospace"
      font-size="10" letter-spacing="2" fill="#D4AF37" opacity="0.6">ALL SYSTEMS NOMINAL · NETWORK ACCESS GRANTED</text>
    <rect class="cursor" x="672" y="255" width="7" height="11" fill="#D4AF37" opacity="0.7"/>
  </g>
</svg>
