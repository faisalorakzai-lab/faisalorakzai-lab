<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#060400"/><stop offset="100%" stop-color="#0D0900"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#FFF5A0" stop-opacity="1"/>
    <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shimG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="48%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF8DC" stop-opacity="0.8"/>
    <stop offset="52%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF5C0"/><stop offset="100%" stop-color="#C8982A"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
.btl{stroke-dasharray:1280;animation:bt 5s linear 1s infinite;}
@keyframes bt{0%{stroke-dashoffset:1280;}100%{stroke-dashoffset:0;}}
/* Property block rises */
.brise{animation:brise var(--bd,3s) ease-out var(--bdy,0s) infinite alternate;}
@keyframes brise{0%{opacity:0.15;}100%{opacity:0.55;}}
/* Floor scan across building */
.fscan{animation:fs 4s ease-in-out infinite;}
@keyframes fs{0%,100%{transform:translateY(0px);opacity:0;}10%{opacity:0.6;}90%{opacity:0.6;}100%{transform:translateY(-60px);}}
.shsw{animation:shsw 5s cubic-bezier(0.4,0,0.6,1) 3s infinite;}
@keyframes shsw{0%{transform:translateX(-420px);}40%,100%{transform:translateX(420px);}}
.bar{animation:bf 2s cubic-bezier(0.16,1,0.3,1) 1s forwards;transform-origin:left;}
@keyframes bf{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.e1{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;opacity:0;}
.e2{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;opacity:0;}
.e3{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;opacity:0;}
.e4{animation:ei 1.2s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;opacity:0;}
@keyframes ei{to{opacity:1;}}
.cb{animation:cb 3s ease-in-out var(--cd,0s) infinite;}
@keyframes cb{0%,100%{opacity:0.5;}50%{opacity:1;}}
.dot-live{animation:dlv 2.2s ease-in-out infinite;}
@keyframes dlv{0%,100%{opacity:0.5;r:3.5;}50%{opacity:1;r:5;}}
  </style>
</defs>
<rect width="420" height="220" fill="url(#bg)"/>

<!-- City skyline visualization (right side) -->
<g fill="#D4AF37" opacity="0.12">
  <!-- Buildings -->
  <rect class="brise" style="--bd:4s;--bdy:0s" x="330" y="90" width="14" height="120"/>
  <rect class="brise" style="--bd:5s;--bdy:0.5s" x="350" y="70" width="10" height="140"/>
  <rect class="brise" style="--bd:3.5s;--bdy:1s" x="366" y="100" width="16" height="110"/>
  <rect class="brise" style="--bd:4.5s;--bdy:0.3s" x="388" y="55" width="12" height="155"/>
  <rect class="brise" style="--bd:6s;--bdy:0.8s" x="406" y="80" width="10" height="130"/>
  <!-- Windows -->
  <rect x="332" y="94" width="3" height="3" fill="#D4AF37" opacity="0.5"/>
  <rect x="337" y="94" width="3" height="3" fill="#D4AF37" opacity="0.3"/>
  <rect x="332" y="102" width="3" height="3" fill="#D4AF37" opacity="0.4"/>
  <rect x="352" y="74" width="3" height="3" fill="#D4AF37" opacity="0.6"/>
  <rect x="357" y="74" width="3" height="3" fill="#D4AF37" opacity="0.3"/>
  <rect x="352" y="82" width="3" height="3" fill="#D4AF37" opacity="0.5"/>
  <rect x="390" y="59" width="3" height="3" fill="#D4AF37" opacity="0.7"/>
  <rect x="395" y="59" width="3" height="3" fill="#D4AF37" opacity="0.4"/>
  <rect x="390" y="67" width="3" height="3" fill="#D4AF37" opacity="0.5"/>
</g>
<!-- Floor scan -->
<clipPath id="skyClip"><rect x="326" y="50" width="90" height="170"/></clipPath>
<rect clip-path="url(#skyClip)" x="326" y="205" width="90" height="2" fill="#D4AF37" opacity="0.4" class="fscan"/>

<!-- Border -->
<rect class="btl" x="1" y="1" width="418" height="218" rx="2" fill="none" stroke="url(#goldH)" stroke-width="1.5" opacity="0.7"/>
<rect x="1" y="1" width="418" height="218" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
<g stroke="#D4AF37" stroke-width="1.5" fill="#D4AF37">
  <line x1="12" y1="12" x2="32" y2="12" opacity="0.8"/><line x1="12" y1="12" x2="12" y2="32" opacity="0.8"/>
  <line x1="388" y1="12" x2="408" y2="12" opacity="0.8"/><line x1="408" y1="12" x2="408" y2="32" opacity="0.8"/>
  <line x1="12" y1="208" x2="32" y2="208" opacity="0.8"/><line x1="12" y1="188" x2="12" y2="208" opacity="0.8"/>
  <line x1="388" y1="208" x2="408" y2="208" opacity="0.8"/><line x1="408" y1="188" x2="408" y2="208" opacity="0.8"/>
  <circle class="cb" style="--cd:0s" cx="12" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:0.75s" cx="408" cy="12" r="2.5"/>
  <circle class="cb" style="--cd:1.5s" cx="12" cy="208" r="2.5"/>
  <circle class="cb" style="--cd:2.25s" cx="408" cy="208" r="2.5"/>
</g>
<clipPath id="cc3"><rect x="1" y="1" width="418" height="218" rx="2"/></clipPath>
<rect clip-path="url(#cc3)" x="0" y="0" width="50" height="220" fill="url(#shimG)" opacity="0.6" class="shsw"/>

<!-- Content -->
<g class="e1">
  <rect x="24" y="20" width="72" height="16" rx="3" fill="#111" stroke="#D4AF37" stroke-width="0.7"/>
  <text x="60" y="31" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#D4AF37">PROPTECH</text>
  <rect x="104" y="20" width="52" height="16" rx="3" fill="#0A1A0A" stroke="#00CC44" stroke-width="0.7"/>
  <circle class="dot-live" cx="116" cy="28" r="3.5" fill="#00CC44"/>
  <text x="136" y="31" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#00CC44">ACTIVE</text>
</g>
<g class="e2" filter="url(#tg)">
  <text x="24" y="70" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="url(#nameGrad)">ORAKZAI</text>
  <text x="24" y="92" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="url(#nameGrad)">PROPERTIES</text>
</g>
<g class="e3">
  <text x="24" y="112" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.5" letter-spacing="2.5" fill="#888">REAL ESTATE TOKENIZATION</text>
</g>
<g class="e3"><rect x="24" y="120" width="200" height="0.7" fill="url(#goldH)" opacity="0.6"/></g>
<g class="e4" font-family="'Courier New',monospace">
  <text x="24" y="140" font-size="7.5" letter-spacing="1" fill="#666">STANDARD</text>
  <text x="110" y="140" font-size="7.5" fill="#D4AF37">ERC-1155 FRACTIONAL</text>
  <text x="24" y="156" font-size="7.5" letter-spacing="1" fill="#666">MIN INVEST</text>
  <text x="110" y="156" font-size="7.5" fill="#D4AF37">PKR 50,000</text>
  <text x="24" y="172" font-size="7.5" letter-spacing="1" fill="#666">YIELD</text>
  <text x="110" y="172" font-size="7.5" fill="#D4AF37">ON-CHAIN · MONTHLY</text>
</g>
<g class="e4">
  <rect x="24" y="190" width="270" height="2" rx="1" fill="#1A1500"/>
  <rect class="bar" x="24" y="190" width="216" height="2" rx="1" fill="#D4AF37" opacity="0.8"/>
  <text x="24" y="205" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#555">BUILD PROGRESS</text>
  <text x="295" y="205" font-family="'Courier New',monospace" font-size="7" letter-spacing="1" fill="#D4AF37">80%</text>
</g>
</svg>
