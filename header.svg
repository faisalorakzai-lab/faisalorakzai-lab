<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <!-- Dark luxury background -->
  <radialGradient id="bgGrad" cx="30%" cy="50%" r="80%">
    <stop offset="0%" stop-color="#08040f"/>
    <stop offset="60%" stop-color="#04020a"/>
    <stop offset="100%" stop-color="#000000"/>
  </radialGradient>
  <!-- Gold glow left (photo area) -->
  <radialGradient id="photoGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F3BA2F" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <!-- Gold gradient for text -->
  <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#8a6800"/>
    <stop offset="20%"  stop-color="#F3BA2F"/>
    <stop offset="50%"  stop-color="#FFF4B8"/>
    <stop offset="80%"  stop-color="#F3BA2F"/>
    <stop offset="100%" stop-color="#8a6800"/>
  </linearGradient>
  <!-- Subtle purple accent -->
  <radialGradient id="purpleGlow" cx="80%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8247E5" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <!-- Gold shine bar -->
  <linearGradient id="shineBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#F3BA2F" stop-opacity="0"/>
    <stop offset="30%"  stop-color="#F3BA2F" stop-opacity="0.8"/>
    <stop offset="70%"  stop-color="#F3BA2F" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#F3BA2F" stop-opacity="0"/>
  </linearGradient>
  <!-- Card gradient -->
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0e00"/>
    <stop offset="100%" stop-color="#0a0600"/>
  </linearGradient>
  <!-- Glow filter -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="subtleGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1400" height="520" fill="url(#bgGrad)"/>
<rect width="1400" height="520" fill="url(#photoGlow)" x="-200"/>
<rect width="1400" height="520" fill="url(#purpleGlow)"/>

<!-- Grid lines (very subtle) -->
<g opacity="0.035" stroke="#F3BA2F" stroke-width="0.5">
  <line x1="0" y1="104" x2="1400" y2="104"/>
  <line x1="0" y1="208" x2="1400" y2="208"/>
  <line x1="0" y1="312" x2="1400" y2="312"/>
  <line x1="0" y1="416" x2="1400" y2="416"/>
  <line x1="280" y1="0" x2="280" y2="520"/>
  <line x1="560" y1="0" x2="560" y2="520"/>
  <line x1="840" y1="0" x2="840" y2="520"/>
  <line x1="1120" y1="0" x2="1120" y2="520"/>
</g>

<!-- Stars / particles -->
<g opacity="0.7">
  <circle cx="80" cy="40" r="1" fill="#F3BA2F"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="90" r="0.8" fill="#fff"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="320" cy="30" r="1.2" fill="#F3BA2F"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="900" cy="50" r="1" fill="#8247E5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" begin="0.8s"/></circle>
  <circle cx="1100" cy="80" r="0.8" fill="#F3BA2F"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite" begin="1.5s"/></circle>
  <circle cx="1300" cy="40" r="1" fill="#fff"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="650" cy="480" r="0.8" fill="#F3BA2F"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" begin="2s"/></circle>
  <circle cx="1200" cy="460" r="1" fill="#8247E5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite" begin="0.6s"/></circle>
  <circle cx="50" cy="480" r="0.7" fill="#fff"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" repeatCount="indefinite" begin="1.2s"/></circle>
</g>

<!-- LEFT PHOTO FRAME (circular, luxury style) -->
<!-- Outer gold ring animated -->
<circle cx="220" cy="260" r="185" fill="none" stroke="#F3BA2F" stroke-width="0.5" opacity="0.15">
  <animate attributeName="r" values="183;187;183" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="220" cy="260" r="172" fill="none" stroke="#F3BA2F" stroke-width="1.5" opacity="0.35">
  <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="220" cy="260" r="160" fill="none" stroke="#F3BA2F" stroke-width="3" opacity="0.6" filter="url(#softGlow)"/>
<circle cx="220" cy="260" r="158" fill="#0d0a00" opacity="0.9"/>

<!-- Photo placeholder with initials (since we can't embed external photo directly in SVG) -->
<circle cx="220" cy="260" r="155" fill="url(#cardGrad)"/>
<!-- Decorative inner pattern -->
<circle cx="220" cy="260" r="140" fill="none" stroke="#F3BA2F" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 8"/>
<!-- Large F.O. monogram -->
<text x="220" y="220" text-anchor="middle" font-size="72" font-weight="900" font-family="Georgia, serif" fill="url(#goldText)" filter="url(#textGlow)" opacity="0.15">F.O</text>
<!-- Orakzai coat-of-arms style icon -->
<text x="220" y="248" text-anchor="middle" font-size="80" font-family="serif" fill="#F3BA2F" filter="url(#glow)" opacity="0.22">🏛</text>
<!-- Photo frame corner ticks -->
<g fill="#F3BA2F" opacity="0.8" filter="url(#subtleGlow)">
  <circle cx="220" cy="102" r="4"/><!-- top -->
  <circle cx="378" cy="260" r="4"/><!-- right -->
  <circle cx="220" cy="418" r="4"/><!-- bottom -->
  <circle cx="62"  cy="260" r="4"/><!-- left -->
</g>
<!-- Scan line animation (luxury tech feel) -->
<clipPath id="photoClip"><circle cx="220" cy="260" r="158"/></clipPath>
<rect x="62" y="100" width="316" height="4" fill="url(#shineBar)" opacity="0.4" clip-path="url(#photoClip)">
  <animate attributeName="y" values="100;418;100" dur="4s" repeatCount="indefinite" calcMode="linear"/>
  <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- NAME & TITLE AREA -->
<!-- "MUHAMMAD FAISAL" big gold -->
<text x="470" y="195" font-size="62" font-weight="900" font-family="Arial Black, sans-serif" fill="url(#goldText)" filter="url(#textGlow)" letter-spacing="4">MUHAMMAD FAISAL</text>
<!-- "ORAKZAI" extra large -->
<text x="470" y="278" font-size="82" font-weight="900" font-family="Arial Black, sans-serif" fill="url(#goldText)" filter="url(#textGlow)" letter-spacing="8" opacity="0.95">ORAKZAI</text>

<!-- Thin gold rule under name -->
<rect x="470" y="293" width="860" height="1.5" fill="url(#shineBar)" opacity="0.6"/>

<!-- Subtitle line -->
<text x="470" y="330" font-size="18" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.75)" letter-spacing="3" font-weight="300">Founder &amp; Chairman · Orakzai Group SMC</text>

<!-- Tag pills row -->
<g font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">
  <!-- Blockchain -->
  <rect x="470" y="348" width="130" height="22" rx="3" fill="#8247E5" opacity="0.25"/>
  <rect x="470" y="348" width="130" height="22" rx="3" fill="none" stroke="#8247E5" stroke-width="0.8" opacity="0.6"/>
  <text x="535" y="363" text-anchor="middle" fill="#8247E5">⛓ BLOCKCHAIN</text>
  <!-- DeFi -->
  <rect x="610" y="348" width="80" height="22" rx="3" fill="#10B981" opacity="0.15"/>
  <rect x="610" y="348" width="80" height="22" rx="3" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
  <text x="650" y="363" text-anchor="middle" fill="#10B981">⬡ DeFi</text>
  <!-- AI -->
  <rect x="700" y="348" width="60" height="22" rx="3" fill="#3B82F6" opacity="0.15"/>
  <rect x="700" y="348" width="60" height="22" rx="3" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.6"/>
  <text x="730" y="363" text-anchor="middle" fill="#3B82F6">🤖 AI</text>
  <!-- Pakistan -->
  <rect x="770" y="348" width="100" height="22" rx="3" fill="#F3BA2F" opacity="0.12"/>
  <rect x="770" y="348" width="100" height="22" rx="3" fill="none" stroke="#F3BA2F" stroke-width="0.8" opacity="0.5"/>
  <text x="820" y="363" text-anchor="middle" fill="#F3BA2F">🌙 PAKISTAN</text>
  <!-- Stevie -->
  <rect x="880" y="348" width="150" height="22" rx="3" fill="#F3BA2F" opacity="0.18"/>
  <rect x="880" y="348" width="150" height="22" rx="3" fill="none" stroke="#F3BA2F" stroke-width="1" opacity="0.7"/>
  <text x="955" y="363" text-anchor="middle" fill="#F3BA2F">🏆 STEVIE GOLD 2026</text>
</g>

<!-- Bio tagline -->
<text x="470" y="405" font-size="14" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.45)" letter-spacing="1" font-style="italic">Designing systems that compound across ventures — from digital intelligence to physical industry.</text>

<!-- Social icons row -->
<g font-size="13" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">
  <text x="470" y="435">🔗 orakzaibond.com</text>
  <text x="660" y="435">💼 linkedin.com/in/faisalorakzaii</text>
  <text x="910" y="435">🌐 faisalorakzai.vercel.app</text>
</g>

<!-- BOTTOM GOLD BAR -->
<rect x="0" y="508" width="1400" height="12" fill="url(#goldText)" opacity="0.12"/>
<rect x="0" y="515" width="1400" height="5" fill="url(#goldText)" opacity="0.3"/>

<!-- RIGHT SIDE — Stevie Award badge -->
<g transform="translate(1270, 60)">
  <!-- Badge outer ring -->
  <circle cx="0" cy="0" r="58" fill="none" stroke="#F3BA2F" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="52" fill="#0d0900" stroke="#F3BA2F" stroke-width="2" opacity="0.9"/>
  <text x="0" y="-20" text-anchor="middle" font-size="22" fill="#F3BA2F" filter="url(#softGlow)">🏆</text>
  <text x="0" y="-3" text-anchor="middle" font-size="8" font-weight="700" fill="#F3BA2F" font-family="monospace" letter-spacing="2">STEVIE GOLD</text>
  <text x="0" y="10" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace" letter-spacing="1">BEST YOUNG</text>
  <text x="0" y="21" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace" letter-spacing="1">ENTREPRENEUR</text>
  <text x="0" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#F3BA2F" font-family="monospace">2026</text>
</g>

<!-- TOP LEFT — Orakzai Group branding -->
<text x="24" y="30" font-size="11" font-family="monospace" fill="#F3BA2F" opacity="0.6" letter-spacing="2">ORAKZAI GROUP SMC</text>
<rect x="24" y="34" width="160" height="0.8" fill="#F3BA2F" opacity="0.3"/>

<!-- TOP RIGHT — global presence -->
<text x="1376" y="30" font-size="11" font-family="monospace" fill="rgba(255,255,255,0.4)" text-anchor="end" letter-spacing="1">PK · UAE · DE · US</text>

</svg>
